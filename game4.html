<html>
  <head>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./javascript/Game.js" defer></script>
  </head>

  <body>
    <div class="UI">
      <h4>
        Money: <span id="money-display">0</span> &nbsp; | &nbsp;
        Wood: <span id="wood-display">0</span> &nbsp; | &nbsp;
        Stone: <span id="stone-display">0</span> &nbsp; | &nbsp;
        Food: <span id="food-display">100</span>
      </h4>
      <h6 style="position: relative; bottom: 30px;">
        Money CPS: <span id="money-cps-display">0.0</span> &nbsp; | &nbsp;
        Wood CPS: <span id="wood-cps-display">0.0</span> &nbsp; | &nbsp;
        Stone CPS: <span id="stone-cps-display">0.0</span> &nbsp; | &nbsp;
        Food CPS: <span id="food-cps-display">0.0</span>
      </h6>
      <h6 style="position: relative; bottom: 40px">
        Citizens: <span id="citizen-display">0</span>/<span id="citizen-cap-display">10</span> &nbsp; | &nbsp;
        Woodcutter: <span id="woodcutter-display">0</span>/<span id="woodcutter-cap-display">5</span> &nbsp; | &nbsp;
        Miner: <span id="miner-display">0</span>/<span id="miner-cap-display">5</span> &nbsp; | &nbsp;
        Hunter: <span id="hunter-display">0</span>/<span id="hunter-cap-display">5</span>
      </h6>
      
      <div class="purchaseContainer" id="citizen-container"></div>

      <div id="shopContainer">
        <div id="buildingContainer">
          <h6 style="position:relative; bottom: 40px; left: 145px;">Buildings</h6>
          <div class="purchaseContainer" id="building-container"></div>
        </div>
  
        <div id="upgradeContainer">
          <h6 style="position:relative; bottom: 40px; left: 145px;">Upgrades</h6>
          <div class="purchaseContainer" id="shop-container"></div>
        </div>
      </div>
    </div>
  
    <div class="mainButtonSec">
      <button class="mainButton" id="main-button">
        <img src="./assets/hammer.png" class="hammer">
      </button>
    </div>
  
    <div class="pageButtonsSec">
      <a href="./story4.html">
        <button class="pageButtons" id="backButton">Back</button>
      </a>
      <button class="pageButtons" id="resetButton">RESET</button>
    </div>
  </body>
</html>
